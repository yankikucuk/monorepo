<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>April Interface — demo</title>
    <link rel="stylesheet" href="/dist/interface.css" />
  </head>
  <body>
    <main style="padding: var(--ai-space-8)">
      <p style="color: var(--ai-text-secondary)">
        Theme:
        <button type="button" data-theme="auto">auto</button>
        <button type="button" data-theme="light">light</button>
        <button type="button" data-theme="dark">dark</button>
      </p>
      <h1>April Interface</h1>
      <p>
        Every component lands on this page with theme and contrast switches, so all modes can be swept in one pass per
        browser. Nothing is styled yet beyond the reset and the token layer.
      </p>
    </main>
    <script type="module">
      for (const button of document.querySelectorAll('[data-theme]')) {
        button.addEventListener('click', () => {
          const theme = button.dataset.theme;
          if (theme === 'auto') {
            delete document.documentElement.dataset.aiTheme;
          } else {
            document.documentElement.dataset.aiTheme = theme;
          }
        });
      }
    </script>
  </body>
</html>
