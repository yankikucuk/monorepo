name: Feature request
description: Suggest an idea or enhancement
title: 'feat: '
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package is this feature request for?
      options:
        - Cyberflake
        - ESLint config
        - Import sort
        - Interface
        - Prettier config
        - Stylelint config
        - TSConfig
        - Repository tooling / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional context
