name: Release

# Packages are private (internal-only), so this workflow only maintains the
# Changesets "version packages" PR — it deliberately does not publish. Add a
# `publish:` input to changesets/action if the packages ever go public.
#
# The version PR is pushed with RELEASE_TOKEN when that secret exists: pushes
# made with the default GITHUB_TOKEN never trigger other workflows, so a PR
# opened that way has no status checks and cannot be merged into the protected
# branch without a close/reopen. RELEASE_TOKEN is a fine-grained personal
# access token scoped to this repository with Contents and Pull requests set
# to read and write. Without it the workflow still runs on GITHUB_TOKEN.

on:
  push:
    branches: [stage]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Tag current package versions once no changesets are pending (i.e.
      # right after a version PR merges). `changeset tag` skips tags that
      # already exist, so this step is idempotent on every push. Tags travel
      # with the git history; GitHub Releases are intentionally not created.
      - name: Tag released versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm changeset tag
          git push origin --tags
