name: 'Issue Labeler'
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  issue-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          configuration-path: .github/issue-labeler.yaml
          enable-versioned-regex: 0
