name: CI

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (packages)
        run: pnpm lint

      - name: Lint (repository-wide)
        run: pnpm lint:build

      - name: Test (with coverage)
        run: pnpm test:coverage | tee coverage-output.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            grep -E 'Statements|Branches|Functions|Lines' coverage-output.txt || echo 'no coverage output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build

      - name: API docs build (TypeDoc)
        run: pnpm docs:api

      - name: Workspace consistency (manypkg)
        run: pnpm manypkg

      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm depcruise

      - name: package.json order (sort-package-json)
        run: pnpm sort:pkg:check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high severity)
        run: pnpm audit --audit-level=high

  knip:
    name: Knip (unused dependencies and exports — advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory while the tool settles in: it passes today, but we want a few
    # weeks of observation before it can fail a pull request. Once it has proven
    # stable, drop `continue-on-error` to turn it into a gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip
        run: pnpm knip
