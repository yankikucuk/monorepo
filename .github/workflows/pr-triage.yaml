name: 'PR Triage'
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    name: Label
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label pull request
        uses: actions/labeler@v5
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          configuration-path: .github/labeler.yaml
          sync-labels: true
  validate-title:
    name: Validate title
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same vocabulary and length limit as .commitlintrc.json (Angular convention).
          REGEX="^(chore|build|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]+\\))?!?: .+$"

          echo "Title: \"$TITLE\""

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::Title must look like 'type(scope): subject' with a type from .commitlintrc.json"
            exit 1
          fi

          if (( ${#TITLE} > 72 )); then
            echo "::error::Title must be at most 72 characters (currently ${#TITLE})"
            exit 1
          fi
