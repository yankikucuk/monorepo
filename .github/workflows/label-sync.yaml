name: Label sync
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - stage
    paths:
      - '.github/labels.yaml'
permissions:
  contents: read
  issues: write
jobs:
  label-sync:
    name: Label sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'yankikucuk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Label sync
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yaml
